# Build check on every push / PR (does not publish a Release).
# Full installers + GitHub Release: push tag v* → workflow "Release".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-24.04
            args: ""
          # macOS is slower/costlier — enable when needed
          # - platform: macos-latest
          #   args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libssl-dev libdbus-1-dev libudev-dev \
            pkg-config build-essential curl wget file

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bun x --bun tsc --noEmit

      - name: Validate translation resources
        run: bun run check:i18n

      - name: Build frontend
        run: bun run build

      - name: Frontend session controller tests
        run: bun run test:session

      - name: Desktop logging tests
        run: bun run test:logging

      - name: Native settings migration tests
        run: bun run test:storage

      - name: Desktop preference migration tests
        run: bun run test:preferences

      - name: Bounded reconnect scan tests
        run: bun run test:reconnect


      - name: Public catalog parser tests
        run: python scripts/test-sync-baseus-catalog.py

      - name: Verify generated support matrix is current
        run: |
          python scripts/generate-headphone-support-matrix.py
          git diff --exit-code docs/model-support-matrix.md

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Rust tests (no Bluetooth hardware required)
        working-directory: src-tauri
        run: cargo test --lib

      # Full Tauri bundle without updater signing (CI only)
      - name: Tauri build (no updater artifacts)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
