# Build B4S for Windows / macOS / Linux and publish GitHub Release
# with Tauri updater artifacts (latest.json + signed installers).
#
# Trigger: push tag v*  (e.g. v0.1.1) or manual workflow_dispatch
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY          — private updater key (never commit)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag without v (e.g. 0.1.1). Leave empty to use package.json"
        required: false
        default: ""
      prerelease:
        description: "Publish as a pre-release (not 'latest'; installed apps do not auto-update to it)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-24.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libssl-dev libdbus-1-dev libudev-dev \
            pkg-config build-essential curl wget file

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # A tag like v0.1.5-beta.1 publishes a pre-release of app version 0.1.5:
      # Windows installers only accept numeric versions, so the suffix stays
      # in the tag/release name, never in the app version.
      - name: Sync version from tag
        shell: bash
        run: |
          PRERELEASE="${{ inputs.prerelease || false }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VER="${TAG#v}"
            if [[ "$VER" == *-* ]]; then
              PRERELEASE=true
              VER="${VER%%-*}"
            fi
          elif [[ -n "${{ inputs.tag }}" ]]; then
            VER="${{ inputs.tag }}"
            TAG="v$VER"
          else
            VER=$(bun -p "require('./package.json').version")
            TAG="v$VER"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          bun scripts/bump-version.mjs "$VER"

      - name: Validate updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun scripts/check-updater-key.mjs

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: B4S ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## B4S ${{ env.RELEASE_TAG }}

            Unofficial desktop companion for multi-model earbuds (BLE).

            ### Install
            - **Windows**: `.msi` / `.exe`
            - **macOS**: `.dmg` (universal)
            - **Linux**: `.AppImage` / `.deb`

            Auto-update uses `latest.json` from this release (signed).
          releaseDraft: false
          # Pre-releases are never "latest", so the updater's releases/latest
          # endpoint keeps serving the previous stable latest.json.
          prerelease: ${{ env.PRERELEASE == 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
