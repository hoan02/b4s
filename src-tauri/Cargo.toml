[package]
name = "b4s"
version = "0.1.4"
description = "B4S — unofficial desktop companion for multi-model earbuds (BLE listening control)"
authors = ["hoan02"]
edition = "2021"

[lib]
name = "b4s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "~2.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
btleplug = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
thiserror = "2"
semver = "1"
log = "0.4"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Enumeration", "Devices_Bluetooth", "Media_Devices", "Foundation_Collections"] }
windows-collections = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
